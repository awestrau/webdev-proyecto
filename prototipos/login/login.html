<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — PixelVault</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS propio -->
    <link rel="stylesheet" href="login.css">

</head>

<body>

      <header class="site-header sticky-top">
        <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
            <div class="container d-flex justify-content-center align-items-center">

                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="../img/logo.jpg" alt="Logo de PixelVault" class="site-logo">
                    <span class="site-title">PIXELVAULT</span>
                </a>

                <form id="search-form" class="search-form d-flex" role="search">
                    <label for="search-product__input" class="visually-hidden">
                        Buscar producto por nombre o categoría
                    </label>

                    <input id="search-product__input" class="form-control" type="search" placeholder="Buscar producto"
                        aria-label="Buscar producto por nombre o categoría" autocomplete="off">

                    <button class="btn btn-primary ms-2 button-85" type="submit">
                        Buscar
                    </button>
                </form>

            </div>
        </nav>
    </header>


    <main>

        <section class="container mt-5" id="login-section">
            <div class="row justify-content-center">
                <div class="col-md-5">

                    <div class="login-card">
                        <div class="login-header text-center">
                            <h2>Iniciar Sesión</h2>
                            <p>Ingresá a tu cuenta para continuar</p>
                        </div>

                        <form id="login-form" novalidate>
                            <div class="mb-3">
                                <label for="login-correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control form-input" id="login-correo"
                                    placeholder="correo@ejemplo.com" required autocomplete="email">
                            </div>

                            <div class="mb-3">
                                <label for="login-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control form-input" id="login-password"
                                    placeholder="Tu contraseña" required autocomplete="current-password">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="login-recordar">
                                <label class="form-check-label" for="login-recordar">Recordarme</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-submit">Ingresar</button>
                        </form>

                        <div class="login-footer text-center mt-4">
                            <p>¿No tenés cuenta? <a href="#" class="login-link">Registrate aquí</a></p>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="container text-center py-4">
            <span class="footer-brand">PIXELVAULT</span>
        </div>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JavaScript propio -->
    <script src="login.js"></script>

</body>

</html>
